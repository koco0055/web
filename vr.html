<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="0 1.5 -5" rotation="0 0 0" color="#F9B5C0"></a-box>
      <a-sphere position="0 2.8 -5" radius="0.75" color="#DE378E"></a-sphere>
      <a-cylinder position="1 1.5 -5" rotation="90 90 0" radius="0.25" height="1" color="#F3E4C3"></a-cylinder>
      <a-cylinder position="-1 1.5 -5" rotation="90 90 0" radius="0.25" height="1" color="#F3E4C3"></a-cylinder>
      <a-cylinder position="0.3 0.5 -5" rotation="0 0 0" radius="0.2" height="1" color="#F3E4C3"></a-cylinder>
      <a-cylinder position="-0.3 0.5 -5" rotation="0 0 0" radius="0.2" height="1" color="#F3E4C3"></a-cylinder>
      <a-plane position="0 0 -5" rotation="-90 0 0" width="1.5" height="3" color="#7BC8A4"></a-plane>
      <a-sky color="#C6C6EB"></a-sky>
    </a-scene>
  </body>
</html>
